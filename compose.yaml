services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: event_planner
      POSTGRES_PASSWORD: event_planner_dev
      POSTGRES_DB: event_planner
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_planner -d event_planner"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
